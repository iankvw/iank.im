name: Production Deployment Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ==================================================
      # [STEP 1] 소스 코드 체크아웃 및 Node.js 빌드 환경 구성
      # ==================================================
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies and Execute Production Build
        run: |
          npm ci
          npm run build

      # ==================================================
      # [STEP 2] Cloudflare Zero Trust SSH 설정 및 터널 주입
      # ==================================================
      - name: Configure Cloudflare Zero Trust Client and SSH Identity
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_on: error
          command: |
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
            curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared.deb || (sudo apt-get install -f -y && sudo dpkg -i cloudflared.deb)
            
            mkdir -p ~/.ssh
            cat << 'EOF' > ~/.ssh/id_ed25519
            ${{ secrets.SSH_KEY }}
            EOF
            chmod 700 ~/.ssh
            chmod 600 ~/.ssh/id_ed25519
            
            truncate -s 0 ~/.ssh/config
            cat >> ~/.ssh/config << 'EOF'
            Host ${{ secrets.AMPERE_HOST }}
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking no
              ProxyCommand /usr/local/bin/cloudflared access ssh --id "${{ secrets.CF_ACCESS_CLIENT_ID }}" --secret "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" --hostname %h
            EOF

      # ==================================================
      # [STEP 3] 빌드 산출물 동기화 (rsync via Cloudflare Tunnel)
      # ==================================================
      - name: Synchronize Dist Artifacts to Ampere Production Host
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_on: error
          command: rsync -avz --delete dist/ ${{ secrets.SSH_USER }}@${{ secrets.AMPERE_HOST }}:/home/ubuntu/docker/iank.im/

      # ==================================================
      # [STEP 4] 디스코드 배포 성공 웹훅 전송
      # ==================================================
      - name: Transmit Discord Notification on Deployment Success
        if: success()
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format=%s)

          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "username": "GitHub",
                 "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                 "embeds": [{
                   "author": {
                     "name": "${{ github.actor }}",
                     "url": "https://github.com/${{ github.actor }}",
                     "icon_url": "https://github.com/${{ github.actor }}.png"
                   },
                   "title": "[${{ github.event.repository.name }}:${{ github.ref_name }}] Deploy Succeeded",
                   "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                   "description": "[`'"$SHORT_SHA"'`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) '"$COMMIT_MSG"'",
                   "color": 2329020
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}