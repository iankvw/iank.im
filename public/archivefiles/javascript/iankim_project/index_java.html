<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>김이언의홈페이지</title>
    <!-- 외부 스타일시트(External Style Sheet) 참조 링크 -->
    <link rel="stylesheet" href="./css/index_java.css">
    
    <script>
        /**
         * 0-255 사이의 난수(Random Number)를 생성하여 무작위 RGB 색상 코드를 반환하는 함수
         * @returns {string} rgb(r, g, b) 형식의 색상 문자열
         */
        function randomColor() {
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);
            return `rgb(${r},${g},${b})`;
        }
    </script>
</head>

<body>
    <!-- 상단 과제 바로가기 내비게이션 바 -->
    <h1>
        <!--<button type="button" onClick="location.href=''">3주차과제</button>&nbsp;&nbsp;&nbsp;&nbsp;-->
        <a href="/practicefiles/javascript/0918/bargain.html" target="_blank">3주차_과제</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="./4week_tr.html" target="_blank">4주차_tr</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="./5week_if.html" target="_blank">5주차_If문과제</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="./5week_switch.html" target="_blank">5주차_switch문과제</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="/practicefiles/javascript/1016/6week_for_hw.html" target="_blank">6주차_for문과제</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="./7week_alert.html" target="_blank">7주차_alert</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="./7week_menu.html" target="_blank">7주차_menu</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="/practicefiles/javascript/9week_hw_st/clock.html" target="_blank">9주차_clock</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="/practicefiles/javascript/9week_hw_st/slider.html" target="_blank">9주차_slider</a>&nbsp;&nbsp;&nbsp;&nbsp;
    </h1>

    <!-- 동적 텍스트 렌더링 대상 컨테이너 -->
    <h2 id="javascript-title"><span style="color:#4285f4;font-size: 100px">J</span></h2>
    
    <!-- 검색창 입력 폼 -->
    <h3><input type="text" id="search" placeholder="Google 검색 또는 URL 입력"></h3>
    
    <!-- 버튼 래퍼 영역 (시계 모달 열기 버튼 & 로그인 버튼) -->
    <div class="button-wrapper">
        <button type="button" id="open-clock-btn" class="circle-btn">시계 보기</button>
        <h4 class="circle-btn"><a href="" target="_blank">로그인</a></h4>
    </div>

    <!-- 시계 보기 모달(Modal Window) 레이아웃 -->
    <div id="clock-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">9주차 실습 - 시계</span>
                <button type="button" id="close-clock-btn" class="modal-close-btn" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <iframe src="/practicefiles/javascript/9week_hw_st/clock.html" title="시계 과제 프레임"></iframe>
            </div>
        </div>
    </div>

    <!-- 페이지 하단 카피라이트/정보 푸터 -->
    <footer>
        <div>
            <span>4주차 과제</span>
            <span>|</span>
            <span>202214038 김이언</span>
        </div>
    </footer>

    <script>
        // DOMContentLoaded 이후 동적 타이틀 스팬 생성 및 색상 적용
        const title = ["a", "v", "a", "s", "c", "r", "i", "p", "t"];
        const targetTitle = document.querySelector("#javascript-title");
        
        title.forEach(element => {
            let spantext = document.createElement('span');
            spantext.textContent = element;
            spantext.style.color = randomColor();
            spantext.style.fontSize = "100px";
            targetTitle.appendChild(spantext);
        });

        // 모달 제어 이벤트 리스너(Modal Control Event Listeners) 바인딩
        const clockModal = document.querySelector("#clock-modal");
        const openClockBtn = document.querySelector("#open-clock-btn");
        const closeClockBtn = document.querySelector("#close-clock-btn");

        /**
         * 모달 활성화 함수
         */
        function openModal() {
            clockModal.classList.add("active");
        }

        /**
         * 모달 비활성화 함수
         */
        function closeModal() {
            clockModal.classList.remove("active");
        }

        // '시계 보기' 버튼 클릭 이벤트 핸들러
        openClockBtn.addEventListener("click", openModal);

        // 상단 '닫기(X)' 버튼 클릭 이벤트 핸들러
        closeClockBtn.addEventListener("click", closeModal);

        // 오버레이 영역 클릭 시 창 닫기 이벤트 핸들러 (이벤트 버블링 필터링)
        clockModal.addEventListener("click", (event) => {
            if (event.target === clockModal) {
                closeModal();
            }
        });

        // ESC 키 입력 시 활성화된 모달 닫기 이벤트 핸들러
        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && clockModal.classList.contains("active")) {
                closeModal();
            }
        });
    </script>
</body>

</html>
