<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let inventory = [];

        try {
            // 아이템 이름 입력받기
            let item = prompt("가방에 넣을 아이템을 입력하세요!");

            // 아이템 이름이 비어 있으면 오류 발생
            if (item === null || item.trim() === "") {

                throw new Error("아이템 이름을 입력하지 않았습니다!");
            }

            // 배열에 아이템 추가
            inventory.push(item);

            document.write(item + " 아이템을 가방에 추가했습니다!");

        } catch (error) {

            // 오류 메시지 출력
            alert("에러");

        }
    </script>
    <script>
        //try2
        let inventory2 = [];

        while (true) {
            try {
                let item = prompt("추가할 아이템을 입력하세요. (종료: 끝)");

                if (item === null || item === "끝") { // 비어있거나 끝 만나면 종료
                    break;
                }

                if (item.trim() === "") {
                    throw new Error("아이템 이름을 입력하지 않았습니다!"); // throw 에러
                }

                // 아이템 추가
                inventory2.push(item);

                alert(item + " 아이템 추가완료!");

            } catch (error) {
                alert(error.message);
            }
        }

        document.write("현재 아이템 가방: " + inventory2.join(", ") + "<br>");
        document.write("게임을 계속 진행합니다!");
        console.log("최종 아이템 가방:", inventory2);
    </script>
</body>

</html>
